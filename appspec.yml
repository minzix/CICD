version: 0.0
os: linux

files:
  # S3에 저장한 파일들 중 destination(AWS EC2)으로 이동시킬 대상을 지정한다.
  # / 이라고 지정하면 S3에 저장한 전체 파일을 뜻한다.
  - source: /
    # EC2의 어떤 경로에 저장할 지 지정한다.
    destination: /home/ubuntu/CICD

permissions:
  - object: /
    owner: ubuntu
    group: ubuntu

hooks:
  ApplicationStart:
    # application이 시작하고 나서 실행할 작업을 기재
    - location: scripts/start-server.sh # 지금 로컬에서 이 경로를 만들어줘야 함
      timeout: 60 # 60초 안에 실행 다 못하면 오류 띄우기
      runas: ubuntu